name: 每日快消品一物一码日报

on:
  schedule:
    # UTC 2:00 = 北京时间 10:00，每天执行
    - cron: '0 2 * * *'
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write  # 允许 workflow 推送文件到仓库

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 生成日报并推送企微
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
        run: |
          python generate_report.py

      - name: 提交并推送到 GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html archive/ .report_history.json
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "自动生成日报 $(TZ='Asia/Shanghai' date +%Y-%m-%d)"
            git push
            echo "✓ 已推送到 GitHub Pages"
          fi
